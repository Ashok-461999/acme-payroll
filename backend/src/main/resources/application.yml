server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: payroll-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/employee_salary}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  seed:
    enabled: ${APP_SEED_ENABLED:true}
    count: ${APP_SEED_COUNT:10000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
