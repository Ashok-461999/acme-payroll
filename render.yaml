services:
  - type: web
    name: acme-payroll
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_SEED_ENABLED
        value: "true"
      - key: APP_SEED_COUNT
        value: "10000"
