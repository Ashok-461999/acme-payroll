services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: employee_salary
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - payroll-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d employee_salary"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: employee_salary
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      APP_SEED_ENABLED: "true"
      APP_SEED_COUNT: "10000"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  payroll-postgres:
